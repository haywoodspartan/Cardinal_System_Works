name: C/C++ CI

# Cardinal is a CMake + Ninja + vcpkg(manifest) project — NOT autotools.
# This builds the verified Windows/MSVC path (windows-msvc-release preset)
# and runs the deterministic CTest suite. The renderer/runtime is currently
# Windows-first (vcpkg pulls imgui[win32-binding] + directx-dxc), so the
# gating job targets windows-latest. CMake >= 3.27 and Ninja are required.
#
# A second, NON-gating job (continue-on-error) configures the linux-clang
# preset and builds only the portable core suites. The Linux window / input
# backends are stubs, so this job exists to keep the portable modules
# compiling under clang -Werror and to show how far the Linux path reaches —
# it must not block merges until a real Linux WSI backend lands.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Activates cl.exe + the VS2022 toolchain/SDK on PATH (the CI
      # equivalent of build.bat's VsDevCmd call).
      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The preset's "Ninja" generator needs ninja on PATH.
      - name: Install Ninja
        run: choco install ninja --no-progress -y

      # Root CMakeLists wires the vcpkg toolchain only when VCPKG_ROOT is
      # set. windows-latest ships vcpkg at VCPKG_INSTALLATION_ROOT (C:\vcpkg).
      - name: Point CMake at the runner's vcpkg
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrEmpty($root)) { $root = "C:\vcpkg" }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # vcpkg manifest mode rebuilds the deps from vcpkg.json; cache the
      # binary archives so subsequent runs are fast. Key on the manifest.
      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure
        run: cmake --preset windows-msvc-release

      # A second pass after a failure relinks only what failed: the runner
      # intermittently holds a freshly linked test .exe open ("The process
      # cannot access the file because it is being used by another process",
      # Defender scanning it) while the next link of the same target runs.
      - name: Build
        run: |
          cmake --build --preset windows-msvc-release
          if ($LASTEXITCODE -ne 0) { cmake --build --preset windows-msvc-release }

      - name: Test (CTest)
        run: ctest --test-dir build/windows-msvc-release --output-on-failure --parallel 4

  linux-core:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld libx11-dev libxcb1-dev libwayland-dev
          cmake --version

      - name: Point CMake at the runner's vcpkg
        run: |
          root="${VCPKG_INSTALLATION_ROOT:-/usr/local/share/vcpkg}"
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure (linux-clang-release)
        run: cmake --preset linux-clang-release

      # Portable core suites only — no window, RHI, or editor targets.
      - name: Build core test suites
        run: >
          cmake --build --preset linux-clang-release --target
          Cardinal_Test_Math Cardinal_Test_Simd Cardinal_Test_Memory Cardinal_Test_Allocators
          Cardinal_Test_FlatContainers Cardinal_Test_Hash Cardinal_Test_Compress
          Cardinal_Test_Jobs Cardinal_Test_Async Cardinal_Test_Result
          Cardinal_Test_FoundationStd Cardinal_Test_CoreKit

      - name: Run core test suites
        run: >
          ctest --test-dir build/linux-clang-release --output-on-failure
          -R '^(math|simd|memory|allocators|flat_containers|hash|compress|jobs|async|result|foundation_std|core_kit)$'
